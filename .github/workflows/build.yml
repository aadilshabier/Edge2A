name: CI

on:
  push:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Flex & Bison)
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison build-essential cmake

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build project
        run: cmake --build build --config Debug

      - name: Run CTest
        run: ctest --test-dir build --output-on-failure
